trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-24.04
stages:
  - stage: Build
    jobs:
      - job: build
        steps:
          - checkout: self
          - template: templates/test-and-package.yml
            parameters:
              artifactName: app-build
  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - script: cat $(Pipeline.Workspace)/app-build/build-info.txt
                  displayName: Show what we are deploying
